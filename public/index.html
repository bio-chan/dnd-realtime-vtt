<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Real-time VTT</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- หน้า Lobby สร้าง/เข้าห้อง -->
    <div id="lobby-screen" class="container">
        <h1>🐉 D&D Virtual Tabletop</h1>
        <div class="card-box">
            <div class="lobby-section">
                <h2>สร้างห้องใหม่ (สำหรับ DM)</h2>
                <button onclick="createRoom()" class="btn-primary">สร้างห้อง (Create Room)</button>
            </div>
            <hr>
            <div class="lobby-section">
                <h2>เข้าร่วมห้อง (สำหรับ Player)</h2>
                <input type="text" id="join-code" placeholder="รหัสห้อง (เช่น A1B2C)">
                <input type="text" id="char-name" placeholder="ชื่อตัวละคร">
                <input type="number" id="char-hp" placeholder="Max HP (เช่น 25)">
                <input type="number" id="char-mana" placeholder="Max Mana (เช่น 10)">
                <button onclick="joinRoom()" class="btn-secondary">เข้าห้อง (Join Room)</button>
            </div>
        </div>
    </div>

    <!-- หน้าจอหลักในห้องเกม -->
    <div id="game-screen" class="hidden">
        <header>
            <div class="header-left">
                <span>ห้อง: <strong id="display-room-code"></strong></span>
                <span class="divider">|</span>
                <span>บทบาท: <span id="display-role" class="badge"></span></span>
            </div>
            <div class="header-right">
                <button id="sound-btn" onclick="toggleSound()" class="btn-icon" title="เปิด/ปิดเสียง">🔊 เสียง: เปิด</button>
                <div id="dm-save-controls" class="hidden" style="display:inline-block;">
                    <button onclick="exportSave()" class="btn-small">💾 Save Game</button>
                    <input type="file" id="import-file" accept=".json" onchange="importSave(event)" style="display:none">
                    <button onclick="document.getElementById('import-file').click()" class="btn-small">📂 Load Save</button>
                </div>
            </div>
        </header>

        <div class="main-grid">
            <!-- ซ้าย: ระบบทอยลูกเต๋า -->
            <section class="panel">
                <h3>🎲 ทอยลูกเต๋า 3D (Dice Roller)</h3>
                <div class="dice-controls">
                    <label style="font-size: 13px; color: #aaa;">Modifier (+/-):</label>
                    <input type="number" id="dice-mod" value="0" placeholder="Modifier (+/-)">
                    <div class="dice-buttons">
                        <button onclick="roll(4)">d4</button>
                        <button onclick="roll(6)">d6</button>
                        <button onclick="roll(8)">d8</button>
                        <button onclick="roll(10)">d10</button>
                        <button onclick="roll(12)">d12</button>
                        <button onclick="roll(20)" class="d20">d20</button>
                        <button onclick="roll(100)">d100</button>
                    </div>
                </div>
                <div id="latest-roll" class="roll-banner">รอการทอยเต๋า...</div>
                <ul id="dice-logs" class="log-list"></ul>
            </section>

            <!-- กลาง: ลำดับการต่อสู้ & การ์ดตัวละคร -->
            <section class="panel">
                <div class="panel-header">
                    <h3>⚔️ ลำดับการต่อสู้ & สนามรบ</h3>
                    <div id="dm-combat-controls" class="hidden">
                        <button onclick="dmAction('SORT_INITIATIVE')">⚡ เรียง Initiative</button>
                        <button onclick="dmAction('NEXT_TURN')" class="btn-primary">เทิร์นถัดไป ⏭️</button>
                    </div>
                </div>
                <div id="entities-list" class="cards-container"></div>
            </section>

            <!-- ขวา: แผงควบคุมเฉพาะ DM -->
            <section id="dm-panel" class="panel hidden">
                <h3>👑 แผงควบคุม DM</h3>
                <div class="dm-box">
                    <h4>+ เพิ่มมอนสเตอร์ / NPC</h4>
                    <input type="text" id="mon-name" placeholder="ชื่อมอนสเตอร์ (เช่น Goblin King)">
                    <input type="number" id="mon-hp" placeholder="Max HP">
                    <input type="number" id="mon-mana" placeholder="Max Mana (ถ้ามี)">
                    <input type="number" id="mon-init" placeholder="Initiative เริ่มต้น">
                    <label style="display:flex; align-items:center; gap:8px; font-size:13px; margin: 8px 0; color:#ddd; cursor:pointer;">
                        <input type="checkbox" id="mon-reveal-hp" style="width:auto; margin:0;">
                        <span>อนุญาตให้ผู้เล่นเห็นเลือดทันที</span>
                    </label>
                    <button onclick="addMonster()" class="btn-primary" style="width:100%;">+ เพิ่มลงสนามรบ</button>
                </div>
            </section>
        </div>
    </div>

    <!-- 3D Dice Roll Animation Overlay -->
    <div id="dice-overlay" class="dice-overlay hidden" onclick="closeDiceOverlay()">
        <div class="dice-stage" onclick="event.stopPropagation()">
            <div id="dice-roller-title" class="dice-roller-title">Adventurer ทอย d20</div>
            
            <div class="dice-scene">
                <div id="dice-cube" class="dice-3d">
                    <div class="face front" id="face-front">?</div>
                    <div class="face back" id="face-back">?</div>
                    <div class="face right" id="face-right">?</div>
                    <div class="face left" id="face-left">?</div>
                    <div class="face top" id="face-top">?</div>
                    <div class="face bottom" id="face-bottom">?</div>
                </div>
            </div>

            <div id="dice-result-details" class="dice-result-details">
                <div id="dice-calc" class="dice-calc"></div>
                <div id="dice-total-display" class="dice-total-display">--</div>
                <div id="dice-special-badge" class="dice-special-badge"></div>
            </div>
            
            <button onclick="closeDiceOverlay()" class="btn-close-dice">ปิดหน้าต่าง (หรือคลิกด้านนอก)</button>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
